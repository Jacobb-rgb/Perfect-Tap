<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Shop v3 "WOW" concept (owner 2026-11-11: "it has no wow effect, add styles, colours, glows,
     lightning in the background, make it mega cool"; references: the Studs UI Pack video, the
     stud-UI tutorials, the Gvesster icon look). A picture for him, not game code: the game builds
     it in StoreView with the Pop kit (studs + rays + bolts as uploaded images, UIGradient, UIStroke). -->
<style>
@font-face { font-family: "Fredoka"; src: url("FONTDIR/FredokaOne-Regular.ttf"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1600px; height: 900px; overflow: hidden; background: #120a30; font-family: "Fredoka", sans-serif; }
#stage { position: relative; width: 1600px; height: 900px; overflow: hidden; }
#bg { position: absolute; inset: -30px; background: url("BG") center/cover; filter: blur(6px) brightness(0.62) saturate(1.4); }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 58% 50%, transparent 30%, rgba(8,4,30,0.75) 100%); }
#aura { position: absolute; left: 230px; top: -40px; width: 1420px; height: 980px; background: radial-gradient(ellipse at 50% 50%, var(--aura) 0%, transparent 62%); opacity: 0.75; }
#fxback { position: absolute; inset: 0; }

/* text: a thick dark outline under the fill (Roblox: UIStroke) and a drop under it */
.t { color: #fff; -webkit-text-stroke: var(--sw, 7px) var(--sc, #1a1030); paint-order: stroke fill; text-shadow: 0 var(--sd, 4px) 0 var(--sc, #1a1030); white-space: nowrap; }
.g { position: relative; display: inline-block; white-space: nowrap; }
.g > .f { position: absolute; left: 0; top: 0; background: var(--gr); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0; text-shadow: none; }

.sticker { filter: url(#stk); }
.stickerw { filter: url(#stkw); }
.ico { overflow: visible; }

/* studs (classic Roblox top studs, like the Studs UI Pack): a lit top-left, a shaded ring */
.studs { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background-image:
    radial-gradient(circle at 42% 38%, rgba(255,255,255,0.55) 0 17%, transparent 19%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.10) 0 30%, transparent 32%),
    radial-gradient(circle at 56% 60%, rgba(0,0,0,0.28) 0 31%, transparent 33%);
  background-size: var(--stud, 26px) var(--stud, 26px); opacity: var(--so, 0.45); mix-blend-mode: overlay; }
.studs.soft { --so: 0.22; }
.halftone { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0.35;
  background-image: radial-gradient(circle, rgba(255,255,255,0.9) 0 1.6px, transparent 2px); background-size: 8px 8px;
  -webkit-mask-image: linear-gradient(transparent 35%, #000 100%); mask-image: linear-gradient(transparent 35%, #000 100%); }
.rays { position: absolute; pointer-events: none; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, var(--rc, rgba(255,255,255,0.9)) 0 7deg, transparent 7deg 20deg);
  -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 70%); mask-image: radial-gradient(circle, #000 0%, transparent 70%); }
.rainbowrays { background: repeating-conic-gradient(from 0deg, #ff4f7a 0 10deg, #ffa53a 10deg 20deg, #ffe84a 20deg 30deg, #5ff07a 30deg 40deg, #4ac8ff 40deg 50deg, #a86aff 50deg 60deg); }
.shards { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; overflow: hidden; }
.shards::before, .shards::after { content: ""; position: absolute; top: -40%; height: 180%; width: 90px; background: rgba(255,255,255,0.16); transform: rotate(28deg); }
.shards::before { left: 30%; } .shards::after { left: 70%; width: 46px; }
.gloss { position: absolute; left: 6px; right: 6px; top: 5px; height: 38%; border-radius: 14px 14px 40% 40% / 14px 14px 18px 18px; background: linear-gradient(rgba(255,255,255,0.42), rgba(255,255,255,0.04)); pointer-events: none; }

/* left HUD: the owner's own tile art, BIGGER (owner 2026-11-11), two a row, TRAIN under */
#hud { position: absolute; left: 12px; top: 92px; width: 240px; display: grid; grid-template-columns: repeat(2, 114px); gap: 8px; }
#hud img { width: 114px; height: 114px; display: block; filter: drop-shadow(0 4px 0 rgba(10,6,30,0.8)); }
#train { position: absolute; left: 12px; top: 704px; width: 236px; height: 78px; border-radius: 14px; background: linear-gradient(#3a4a6a, #232b3e); border: 4px solid #1a1030; box-shadow: 0 5px 0 #0c0828; padding: 6px 10px; }
#train .tt { font-size: 20px; --sw: 5px; --sd: 2px; }
#train .bar { margin-top: 4px; height: 12px; border-radius: 6px; background: #12161f; overflow: hidden; border: 2px solid #0c0828; }
#train .bar i { display: block; width: 62%; height: 100%; background: linear-gradient(#ffd04a, #f08a1a); }
#train .send { position: absolute; right: 8px; top: 6px; height: 30px; padding: 0 12px; border-radius: 9px; background: linear-gradient(#8cff4a, #2fb51d); border: 3px solid #1a1030; font-size: 18px; line-height: 24px; --sw: 4px; --sd: 2px; }
#money { position: absolute; left: 16px; top: 790px; }
#money .m { font-size: 54px; --sw: 9px; --sc: #0d3b06; --sd: 5px; }
#money .i { font-size: 22px; --sw: 5px; --sd: 2px; margin-top: -4px; }

/* the window */
#win { position: absolute; left: 266px; top: 16px; width: 1318px; height: 866px; border-radius: 28px; border: 6px solid #1a1030;
  background: var(--body); box-shadow: 0 10px 0 #0c0828, 0 0 0 3px rgba(255,255,255,0.18), 0 0 60px 10px var(--glow); }
#win > .inner { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; }
#head { position: absolute; left: 0; right: 0; top: 0; height: 104px; background: var(--headg); border-bottom: 6px solid #1a1030; }
#head .studs { --stud: 30px; --so: 0.55; }
#bodyfx { position: absolute; left: 0; right: 0; top: 104px; bottom: 0; overflow: hidden; }
#bodyfx .studs { --stud: 34px; --so: 0.10; mix-blend-mode: normal; }
#shopicon { position: absolute; left: -46px; top: -44px; z-index: 6; transform: rotate(-12deg); }
#title { position: absolute; left: 90px; top: 8px; z-index: 5; font-size: 70px; --sw: 10px; --sd: 6px; transform: rotate(-3deg); }
#tabs { position: absolute; left: 298px; top: 20px; z-index: 5; display: flex; gap: 7px; }
.tab { position: relative; height: 62px; border-radius: 18px; border: 5px solid #1a1030; padding: 0 11px 0 48px; display: flex; align-items: center; font-size: 21px; --sw: 6px; --sd: 3px;
  background: var(--tg); box-shadow: 0 6px 0 #0c0828, inset 0 -6px 0 rgba(0,0,0,0.22), inset 0 3px 0 rgba(255,255,255,0.45); }
.tab .ico { position: absolute; left: -9px; top: -9px; }
.tab .studs { --stud: 18px; --so: 0.5; }
.tab.off { filter: brightness(0.82) saturate(0.85); transform: scale(0.94); }
.tab.on { transform: translateY(-4px) scale(1.08); z-index: 3; box-shadow: 0 0 0 4px #fff, 0 0 26px 8px var(--tglow), 0 8px 0 #0c0828, inset 0 -6px 0 rgba(0,0,0,0.22), inset 0 3px 0 rgba(255,255,255,0.5); }
#close { position: absolute; right: 16px; top: 16px; z-index: 5; width: 74px; height: 72px; border-radius: 18px; border: 5px solid #1a1030; background: linear-gradient(#ff7a7a, #e0262f 60%, #b4141e);
  box-shadow: 0 6px 0 #0c0828, inset 0 -6px 0 rgba(0,0,0,0.25), inset 0 3px 0 rgba(255,255,255,0.5); text-align: center; font-size: 52px; line-height: 60px; --sw: 8px; --sd: 4px; transform: rotate(4deg); overflow: hidden; }
#body { position: absolute; left: 20px; right: 20px; top: 124px; bottom: 22px; }

/* cards */
.row { display: flex; gap: 16px; }
.card { position: relative; flex: 1; border-radius: 22px; border: 5px solid #1a1030; background: var(--cb);
  box-shadow: 0 8px 0 #0c0828, inset 0 -8px 0 rgba(0,0,0,0.22), inset 0 0 0 3px rgba(255,255,255,0.35); }
.card > .clip { position: absolute; inset: 0; border-radius: 17px; overflow: hidden; }
.card > .clip .studs { --stud: 24px; --so: 0.3; }
.card > .lay { position: absolute; inset: 0; z-index: 2; }
.card .nm { position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-size: 30px; --sw: 7px; --sd: 4px; }
.card .ds { position: absolute; left: 10px; right: 10px; top: 48px; text-align: center; font-size: 17px; line-height: 1.15; --sw: 4px; --sd: 2px; white-space: normal; }
.pic { position: absolute; object-fit: contain; }
.glowdisc { position: absolute; border-radius: 50%; background: radial-gradient(circle, var(--gd, rgba(255,255,255,0.85)) 0%, transparent 65%); pointer-events: none; }

.btn { position: absolute; z-index: 4; height: 58px; border-radius: 16px; border: 5px solid #1a1030; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 30px; --sw: 7px; --sd: 3px; --sc: #0b3a05;
  background: linear-gradient(#a4ff5a 0%, #4fd62a 50%, #2aa61a 100%); box-shadow: 0 6px 0 #0c0828, inset 0 -6px 0 #1f8a12, inset 0 3px 0 rgba(255,255,255,0.6); overflow: hidden; }
.btn .halftone { opacity: 0.28; }
.btn > * { position: relative; }
.btn .rb { width: 32px; height: 32px; filter: drop-shadow(0 2px 0 #0b3a05); }
.btn.gold { background: linear-gradient(#fff27a, #ffc21a 55%, #f0900a); box-shadow: 0 6px 0 #0c0828, inset 0 -6px 0 #c06a00, inset 0 3px 0 rgba(255,255,255,0.65); --sc: #5a2c00; }
.btn.red { background: linear-gradient(#ff8a7a, #f0383a 55%, #c41c26); box-shadow: 0 6px 0 #0c0828, inset 0 -6px 0 #8e0c18, inset 0 3px 0 rgba(255,255,255,0.55); --sc: #4a060c; }
.btn.purple { background: linear-gradient(#e0a0ff, #a64dff 55%, #7424d8); box-shadow: 0 6px 0 #0c0828, inset 0 -6px 0 #4e14a0, inset 0 3px 0 rgba(255,255,255,0.55); --sc: #2a0a5a; }
.btn.grey { background: linear-gradient(#d8dce8, #9aa0b6); box-shadow: 0 6px 0 #0c0828, inset 0 -6px 0 #6a7088, inset 0 3px 0 rgba(255,255,255,0.6); --sc: #2a2e3c; }
.btn.two { flex-direction: column; gap: 0; line-height: 1; }
.btn.two .c { font-size: 17px; --sw: 4px; --sd: 2px; }
.btn.two .r { display: flex; align-items: center; gap: 4px; font-size: 26px; }
.btn.two .rb { width: 26px; height: 26px; }

.rib { position: absolute; z-index: 6; white-space: nowrap; font-size: 21px; padding: 3px 16px; border-radius: 14px; border: 4px solid #1a1030; --sw: 5px; --sd: 2px;
  background: linear-gradient(#ff8ab0, #f0186a); box-shadow: 0 5px 0 #0c0828, inset 0 2px 0 rgba(255,255,255,0.55); transform: rotate(-4deg); }
.rib.gold { background: linear-gradient(#fff27a, #ffb21a); --sc: #5a2c00; }
.rib.blue { background: linear-gradient(#8ae6ff, #2a8cff); }
.rib.green { background: linear-gradient(#b4ff6a, #3fd02a); --sc: #0b3a05; }
.rib .ico { position: absolute; right: -24px; top: -22px; }

.chip { position: absolute; z-index: 4; border-radius: 12px; border: 4px solid #1a1030; padding: 1px 10px; font-size: 20px; --sw: 5px; --sd: 2px; background: rgba(20,12,50,0.75); box-shadow: 0 4px 0 #0c0828; white-space: nowrap; }

/* rarity tiles */
.rt { position: relative; border-radius: 16px; border: 4px solid #1a1030; background: var(--cb); box-shadow: 0 5px 0 #0c0828, inset 0 -5px 0 rgba(0,0,0,0.22), inset 0 0 0 2px rgba(255,255,255,0.4); overflow: hidden; }
.rt .studs { --stud: 18px; --so: 0.35; }
.rt img { position: absolute; left: 50%; transform: translateX(-50%); }
.rt .pc { position: absolute; right: 6px; bottom: 0; font-size: 30px; --sw: 6px; --sd: 3px; }
.rt .rn { position: absolute; left: 6px; top: 3px; font-size: 15px; --sw: 4px; --sd: 2px; }

/* colours */
.c-green  { --cb: linear-gradient(160deg, #a6ff6a, #3fd02a 50%, #1e9a18); }
.c-blue   { --cb: linear-gradient(160deg, #8ae0ff, #2f8cff 50%, #1d4fc6); }
.c-purple { --cb: linear-gradient(160deg, #e6a6ff, #a64dff 50%, #6418c8); }
.c-pink   { --cb: linear-gradient(160deg, #ffb0dc, #ff4fa3 50%, #c8106a); }
.c-orange { --cb: linear-gradient(160deg, #ffd88a, #ff9a2a 50%, #d8540a); }
.c-gold   { --cb: linear-gradient(160deg, #fff6b0, #ffcf2a 50%, #e8880a); }
.c-red    { --cb: linear-gradient(160deg, #ffa496, #ff4a4a 50%, #b4142a); }
.c-teal   { --cb: linear-gradient(160deg, #9affee, #20d6b8 50%, #0a8a7a); }
.c-navy   { --cb: linear-gradient(160deg, #8a9cff, #3a46c8 50%, #1a1f78); }
.c-night  { --cb: linear-gradient(160deg, #3a3a9a, #1a1a5a 55%, #0a0a2a); }
.c-cyber  { --cb: linear-gradient(160deg, #3ad8ff, #1a5aff 45%, #2a0a8a); }
.c-mythic { --cb: linear-gradient(160deg, #ff5a6a, #8a0a3a 45%, #1a0420); }
.c-rainbow { --cb: linear-gradient(120deg, #ff6a8a, #ffb84a 20%, #ffe94a 36%, #5ff07a 52%, #4ac8ff 70%, #a86aff 88%); }

/* the mythic frame: a rainbow rim that runs (in the game a UIGradient turning) */
.mythic { border-color: transparent !important; background: linear-gradient(#1a0420, #1a0420) padding-box, conic-gradient(from 30deg, #ff3a6a, #ffa53a, #ffe84a, #5ff07a, #4ac8ff, #a86aff, #ff3a6a) border-box !important; }
.mythic > .clip { background: var(--cb); }

.big { position: absolute; z-index: 4; }
.wide { position: relative; border-radius: 22px; border: 5px solid #1a1030; background: var(--cb); box-shadow: 0 8px 0 #0c0828, inset 0 -8px 0 rgba(0,0,0,0.22), inset 0 0 0 3px rgba(255,255,255,0.35); }
.wide > .clip { position: absolute; inset: 0; border-radius: 17px; overflow: hidden; }
.wide > .clip .studs { --stud: 26px; --so: 0.28; }
.wide > .lay { position: absolute; inset: 0; z-index: 2; }
.lines { font-size: 21px; line-height: 1.4; --sw: 5px; --sd: 2px; }
.lines .ico { vertical-align: -6px; margin-right: 4px; }
.slot { position: absolute; border-radius: 14px; border: 4px solid #1a1030; background: linear-gradient(#3a2a6a, #1e1440); box-shadow: 0 4px 0 #0c0828, inset 0 3px 0 rgba(255,255,255,0.18); }
.slot .q { position: absolute; left: 0; right: 0; top: -2px; text-align: center; font-size: 18px; --sw: 4px; --sd: 2px; }
.slot .w { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 15px; --sw: 4px; --sd: 2px; }
.plus { position: absolute; font-size: 54px; --sw: 9px; --sd: 4px; z-index: 4; }
/* motion: rays turn, the mythic rim runs, a shine sweeps the buttons, the open tab bobs, glows breathe */
.rays { transform: rotate(calc(var(--rot, 0) * 1deg)); }
.mythic { background: linear-gradient(#1a0420, #1a0420) padding-box, conic-gradient(from calc(var(--rot, 0) * 9deg + 30deg), #ff3a6a, #ffa53a, #ffe84a, #5ff07a, #4ac8ff, #a86aff, #ff3a6a) border-box !important; }
.btn::after { content: ""; position: absolute; top: -14px; bottom: -14px; width: 44px; left: calc(var(--sh, -40) * 1%); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent); transform: skewX(-22deg); pointer-events: none; }
.tab.on { transform: translateY(calc(-4px + var(--bob, 0) * 1px)) scale(1.08); }
.glowdisc { opacity: var(--gp, 1); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="aura"></div><div id="vig"></div>
  <svg id="fxback" width="1600" height="900"></svg>
  <div id="hud"></div>
  <div id="train"><div class="tt t">TRAIN 5/8</div><div class="bar"><i></i></div><div class="send t">SEND</div></div>
  <div id="money"><div class="m t g" style="--gr:linear-gradient(#e8ffb0,#7cf04a 55%,#2fbf1f)"><span>$4.82M</span><span class="f">$4.82M</span></div><div class="i t">+$1.84K/s</div></div>
  <div id="win"><div class="inner">
      <div id="head"><div class="studs"></div><div class="shards"></div></div>
      <div id="bodyfx"><div class="studs"></div><svg id="fxbody" width="1306" height="760" style="position:absolute;left:0;top:0"></svg></div>
    </div>
    <div id="shopicon"></div>
    <div id="title" class="t g" style="--gr:linear-gradient(#ffffff 40%, var(--titlelow))"><span>SHOP</span><span class="f">SHOP</span></div>
    <div id="tabs"></div>
    <div id="close" class="t"><div class="studs" style="--stud:18px"></div>X</div>
    <div id="body"></div>
  </div>
  <svg id="fxfront" width="1600" height="900" style="position:absolute;left:0;top:0;pointer-events:none"></svg>
</div>
<script src="icons.js"></script>
<script>
document.head.insertAdjacentHTML("beforeend", "<style>" + ICONS.css + "</style>");
document.body.insertAdjacentHTML("afterbegin", ICONS.defs());
const ic = (n, s, extra) => ICONS.icon(n, s, extra);
const I = (n) => `ICONS/${n}.png`;
const T = (n) => `TILES/${n}.png`;
const page = new URLSearchParams(location.search).get("page") || "featured";
const R = (s = 32) => `<img class="rb" src="${I("robux")}" style="width:${s}px;height:${s}px">`;
const gt = (text, cls, style, grad) => `<span class="g t ${cls || ""}" style="${style || ""};--gr:${grad}"><span>${text}</span><span class="f">${text}</span></span>`;

// ---------------- the themes (one colour world per tab)
const THEMES = {
  featured: { head: "linear-gradient(#ff7aa8, #ff2a6a 55%, #c80a4a)", body: "radial-gradient(ellipse at 50% 0%, #a8166a 0%, #5a0a46 40%, #2a0632 100%)", glow: "rgba(255,60,140,0.75)", aura: "rgba(255,40,120,0.9)", bolt: "#ff9ad0", bolt2: "#ffd84a", title: "#ffd0e4" },
  golems: { head: "linear-gradient(#d29aff, #9a3cff 55%, #6a14d8)", body: "radial-gradient(ellipse at 50% 0%, #6a2ad8 0%, #3a1490 40%, #1a0a4a 100%)", glow: "rgba(170,90,255,0.8)", aura: "rgba(150,70,255,0.9)", bolt: "#d6a6ff", bolt2: "#7ff4ff", title: "#e8d0ff" },
  blasters: { head: "linear-gradient(#7ae8ff, #1aa2ff 55%, #0a5ad8)", body: "radial-gradient(ellipse at 50% 0%, #1a5ae0 0%, #0c2a8a 40%, #060e3a 100%)", glow: "rgba(40,180,255,0.85)", aura: "rgba(30,160,255,0.95)", bolt: "#9af4ff", bolt2: "#ffffff", title: "#bff0ff" },
  passes: { head: "linear-gradient(#fff07a, #ffb41a 55%, #e8780a)", body: "radial-gradient(ellipse at 50% 0%, #7a2ad0 0%, #44148a 40%, #1e0a48 100%)", glow: "rgba(255,190,40,0.8)", aura: "rgba(255,170,30,0.85)", bolt: "#ffe07a", bolt2: "#ffffff", title: "#fff3b0" },
  boosts: { head: "linear-gradient(#b4ff6a, #3fd02a 55%, #1a9a18)", body: "radial-gradient(ellipse at 50% 0%, #1e9a3a 0%, #0c5a28 40%, #052a14 100%)", glow: "rgba(90,255,90,0.75)", aura: "rgba(60,230,90,0.85)", bolt: "#c8ff8a", bolt2: "#fff27a", title: "#e6ffc8" },
  cash: { head: "linear-gradient(#e6ff7a, #8cd62a 55%, #3a9a18)", body: "radial-gradient(ellipse at 50% 0%, #1aa060 0%, #0a6a40 40%, #033020 100%)", glow: "rgba(140,255,80,0.75)", aura: "rgba(120,240,60,0.85)", bolt: "#fff27a", bolt2: "#c8ff8a", title: "#f6ffd0" },
};
const th = THEMES[page];
const root = document.documentElement.style;
root.setProperty("--body", th.body); root.setProperty("--headg", th.head); root.setProperty("--glow", th.glow); root.setProperty("--aura", th.aura); root.setProperty("--titlelow", th.title);

// ---------------- lightning (seeded, so every render is the same picture)
let seed = { featured: 11, golems: 23, blasters: 37, passes: 41, boosts: 53, cash: 67 }[page];
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
function boltPts(x1, y1, x2, y2, disp, depth) {
  if (depth === 0) return [[x1, y1], [x2, y2]];
  const mx = (x1 + x2) / 2 + (rnd() - 0.5) * disp, my = (y1 + y2) / 2 + (rnd() - 0.5) * disp;
  const a = boltPts(x1, y1, mx, my, disp / 2, depth - 1), b = boltPts(mx, my, x2, y2, disp / 2, depth - 1);
  return a.concat(b.slice(1));
}
function bolt(x1, y1, x2, y2, col, width = 1, branches = 3) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  const pts = boltPts(x1, y1, x2, y2, len * 0.42, 6);
  const paths = [pts];
  for (let i = 0; i < branches; i++) {
    const k = Math.floor(pts.length * (0.2 + rnd() * 0.6)), [bx, by] = pts[k];
    const ang = Math.atan2(y2 - y1, x2 - x1) + (rnd() < 0.5 ? -1 : 1) * (0.5 + rnd() * 0.6), bl = len * (0.18 + rnd() * 0.22);
    paths.push(boltPts(bx, by, bx + Math.cos(ang) * bl, by + Math.sin(ang) * bl, bl * 0.4, 4));
  }
  const d = (p) => "M" + p.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(" L ");
  let s = `<g class="bz">`;
  paths.forEach((p, i) => {
    const w = (i === 0 ? 1 : 0.55) * width;
    s += `<path d="${d(p)}" fill="none" stroke="${col}" stroke-width="${16 * w}" stroke-linejoin="round" stroke-linecap="round" opacity="0.45" filter="url(#blur8)"/>`;

// ---------------- one frame of motion at t seconds (a 2 s loop; the game: TweenService on the same things)
window.frame = function (t) {
  const r = document.documentElement.style;
  r.setProperty("--rot", (t * 20).toFixed(2)); // the rays repeat every 20 deg: 40 deg a loop
  r.setProperty("--sh", (((t % 2) / 2) * 280 - 60).toFixed(1));
  r.setProperty("--bob", (Math.sin(t * Math.PI) * 3).toFixed(2));
  r.setProperty("--gp", (0.8 + 0.2 * Math.sin(t * Math.PI * 2)).toFixed(3));
  document.querySelectorAll(".bz").forEach((g, k) => {
    const ph = (t + k * 0.43) % 1;
    const on = ph < 0.09 || (ph > 0.15 && ph < 0.22);
    g.setAttribute("opacity", on ? 1 : 0.18);
  });
  document.querySelectorAll(".spk").forEach((g, k) => {
    const x = +g.dataset.x, y = +g.dataset.y, sz = +g.dataset.s;
    const p = 0.45 + 0.55 * Math.abs(Math.sin(t * Math.PI + k * 1.3));
    g.setAttribute("transform", `translate(${x} ${y}) scale(${((sz / 100) * p).toFixed(3)}) rotate(${(t * 45).toFixed(1)})`);
  });
};
