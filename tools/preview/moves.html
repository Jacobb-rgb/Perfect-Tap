<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Terra Forge Player Moves</title>
    <style>
      @font-face {
        font-family: "Luckiest Guy";
        src: url("/node_modules/@fontsource/luckiest-guy/files/luckiest-guy-latin-400-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #caption {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-end;
        padding: 0 0 4.2% 4.5%;
        color: #fff;
      }
      #title {
        font-family: "Luckiest Guy", sans-serif;
        font-size: 5.2vw;
        line-height: 1;
        letter-spacing: 0.15vw;
        color: #ffd36b;
        -webkit-text-stroke: 0.22vw #4a2410;
        paint-order: stroke fill;
        text-shadow: 0 0.35vw 0 #4a2410;
        will-change: transform, opacity;
      }
      #subtitle {
        margin-top: 0.8vw;
        font-family: "Arial Rounded MT Bold", "Avenir Next", Arial, sans-serif;
        font-weight: bold;
        font-size: 2vw;
        padding: 0.45vw 1.3vw;
        border-radius: 1.4vw;
        background: rgba(40, 22, 12, 0.72);
        will-change: transform, opacity;
      }
      #brand {
        position: absolute;
        top: 3.4%;
        left: 4.5%;
        font-family: "Luckiest Guy", sans-serif;
        font-size: 2.1vw;
        color: #fff;
        letter-spacing: 0.1vw;
        text-shadow: 0 0.2vw 0 rgba(0, 0, 0, 0.45);
      }
      #brand small {
        display: block;
        margin-top: 0.3vw;
        font-family: "Arial Rounded MT Bold", Arial, sans-serif;
        font-size: 1.15vw;
        letter-spacing: 0;
        opacity: 0.85;
      }
      #dots {
        position: absolute;
        top: 4.2%;
        right: 4.5%;
        display: flex;
        gap: 0.7vw;
      }
      #dots div {
        width: 1.05vw;
        height: 1.05vw;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 0.12vw 0 rgba(0, 0, 0, 0.3);
      }
      #dots div.on {
        background: #ffd36b;
      }
      #dots div.done {
        background: rgba(255, 211, 107, 0.6);
      }
      body.clean .layer {
        display: none !important;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage">
      <div id="caption" class="layer">
        <div id="title">MOVE</div>
        <div id="subtitle">text</div>
      </div>
      <div class="layer">
        <div id="brand">TERRA FORGE<small>pohyby hráče · náhled z herního kódu (MoveMath na R15 postavičce)</small></div>
        <div id="dots"></div>
      </div>
    </div>
    <script type="module" src="/moves.js"></script>
  </body>
</html>
