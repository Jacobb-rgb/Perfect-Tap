<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Terra Forge Preview</title>
    <style>
      @font-face {
        font-family: "Fredoka One";
        src: url("/node_modules/@fontsource/fredoka-one/files/fredoka-one-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Comic Neue Angular";
        src: url("/fonts/ComicNeue-Angular-Bold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Press Start 2P";
        src: url("/fonts/PressStart2P-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 900;
        src: url("/fonts/Montserrat-Black.ttf") format("truetype");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 700;
        src: url("/fonts/Montserrat-Bold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 500;
        src: url("/fonts/Montserrat-Medium.ttf") format("truetype");
      }
      @font-face {
        font-family: "Luckiest Guy";
        src: url("/node_modules/@fontsource/luckiest-guy/files/luckiest-guy-latin-400-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
      }
      #ui {
        position: absolute;
        left: 0;
        top: 0;
        width: 1600px;
        height: 900px;
        pointer-events: none;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"><div id="ui"></div></div>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
